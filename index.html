
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <meta name="theme-color" content="#090D0A">
    <title>NOVA VPN</title>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/animations.css">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div class="app">

    <header class="header">
        <div class="brand">
            <div class="brand-logo">N</div>
            <span id="brandName">NOVA</span>
        </div>

        <div class="header-actions">
            <button id="languageBtn" class="icon-btn">RU</button>
            <button class="icon-btn" data-screen="support">?</button>
        </div>
    </header>

    <main id="app">
        <div class="loading">Загрузка...</div>
    </main>

    <nav class="bottom-nav" id="bottomNav" hidden>
        <button data-screen="dashboard" class="nav-btn">
            <span>⌂</span>
            <small data-i18n="home">Главная</small>
        </button>

        <button data-screen="connection" class="nav-btn">
            <span>↗</span>
            <small data-i18n="connect">Подключение</small>
        </button>

        <button data-screen="devices" class="nav-btn">
            <span>▣</span>
            <small data-i18n="devices">Устройства</small>
        </button>

        <button data-screen="pricing" class="nav-btn">
            <span>◇</span>
            <small data-i18n="plans">Тарифы</small>
        </button>
    </nav>

    <div id="toast" class="toast"></div>

</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
